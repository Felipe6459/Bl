<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolher dezenas — BL</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./">BL</a><a class="btn btn-outline" href="minha-conta.html">Minha conta</a></header>
<main class="section game-page">
  <div class="game-head">
    <span class="eyebrow">Seu jogo</span>
    <h1 id="title">Carregando bolão...</h1>
    <p id="description">Carregando configuração...</p>
  </div>

  <section class="number-picker">
    <div class="picker-top">
      <div>
        <h2 class="picker-title">Escolha suas dezenas</h2>
        <p class="picker-help">Toque nos números para selecionar. Você precisa escolher exatamente a quantidade indicada.</p>
      </div>
      <div id="counter" class="selection-badge">0/—</div>
    </div>
    <div id="numbers" class="number-grid"></div>
    <div class="selected-area">
      <span>Dezenas escolhidas</span>
      <div id="selected" class="selected-numbers">—</div>
    </div>
  </section>

  <div class="card game-actions">
    <button id="continue" class="btn btn-large" disabled>Continuar para pagamento</button>
    <p id="msg" class="message"></p>
    <div id="payment" style="display:none;margin-top:20px"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://ujddnzckfrksetsfgden.supabase.co','sb_publishable_Lo9uaX-E9hHcL-w2El6M3g_OoCRma3W');
const id=new URLSearchParams(location.search).get('bolao');
const set=new Set();
const box=document.getElementById('numbers');
const counter=document.getElementById('counter');
const selected=document.getElementById('selected');
const continueBtn=document.getElementById('continue');
const msg=document.getElementById('msg');
const paymentBox=document.getElementById('payment');
let quantidade=0;
let bolao=null;

function renderNumbers(){
  box.innerHTML='';
  for(let n=1;n<=60;n++){
    const b=document.createElement('button');
    b.textContent=String(n).padStart(2,'0');
    b.className='number-ball';
    b.type='button';
    b.setAttribute('aria-label',`Dezena ${String(n).padStart(2,'0')}`);
    b.onclick=()=>{
      if(set.has(n)){
        set.delete(n);
        b.classList.remove('selected');
      }else if(set.size<quantidade){
        set.add(n);
        b.classList.add('selected');
      }
      update();
    };
    box.appendChild(b);
  }
}

function update(){
  const arr=[...set].sort((a,b)=>a-b);
  counter.textContent=`${arr.length}/${quantidade}`;
  counter.classList.toggle('complete',arr.length===quantidade);
  selected.innerHTML=arr.length?arr.map(n=>`<span>${String(n).padStart(2,'0')}</span>`).join(''):'<em>Nenhuma dezena selecionada</em>';
  continueBtn.disabled=arr.length!==quantidade;
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
}

function showPayment(data){
  const pix=data?.pix || {};
  const encoded=String(pix.encodedImage || '').trim();
  const payload=String(pix.payload || '').trim();
  paymentBox.style.display='block';
  paymentBox.innerHTML=`
    <div class="card" style="text-align:center">
      <h2>💳 Pagamento via Pix</h2>
      <p>Valor: <strong>R$ ${Number(data.value||0).toFixed(2).replace('.',',')}</strong></p>
      ${encoded ? `<img src="data:image/png;base64,${encoded}" alt="QR Code Pix" style="width:min(280px,100%);height:auto;margin:10px auto;display:block">` : '<p>QR Code não retornado pelo Asaas.</p>'}
      ${payload ? `<p style="word-break:break-all;text-align:left;font-size:13px">${escapeHtml(payload)}</p><button type="button" class="btn btn-large" id="copyPix">📋 Copiar Pix</button>` : ''}
      ${data.invoice_url ? `<p><a class="btn btn-outline" href="${escapeHtml(data.invoice_url)}" target="_blank" rel="noopener">Abrir cobrança</a></p>` : ''}
      <p id="pixStatus" class="message"></p>
    </div>`;
  const copy=document.getElementById('copyPix');
  if(copy && payload){
    copy.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(payload);
        document.getElementById('pixStatus').textContent='Pix copiado. Agora é só pagar no aplicativo do seu banco.';
      }catch(e){
        document.getElementById('pixStatus').textContent='Não foi possível copiar automaticamente. Selecione o código Pix acima e copie manualmente.';
      }
    };
  }
}

async function getFunctionError(error,data){
  if(data?.error) return data.error;
  try{
    if(error?.context && typeof error.context.json==='function'){
      const body=await error.context.json();
      if(body?.error) return body.error;
    }
  }catch(e){}
  return error?.message || 'Não foi possível gerar o pagamento Pix.';
}

(async()=>{
  if(!id){msg.textContent='Bolão não informado.';return;}
  const {data,error}=await sb.from('boloes').select('id,nome,concurso,valor_jogo,descricao,quantidade_dezenas,premio').eq('id',id).eq('status','ativo').single();
  if(error||!data){msg.textContent='Bolão não encontrado ou já encerrado.';return;}
  bolao=data;
  quantidade=Number(data.quantidade_dezenas);
  if(!Number.isInteger(quantidade)||quantidade<1||quantidade>60){msg.textContent='Configuração de dezenas inválida.';return;}
  document.getElementById('title').textContent=data.nome;
  document.getElementById('description').textContent=`Concurso ${data.concurso}. ${data.descricao||`Escolha exatamente ${quantidade} dezenas.`} Valor por jogo: R$ ${Number(data.valor_jogo).toFixed(2).replace('.',',')}. Prêmio: R$ ${Number(data.premio||0).toFixed(2).replace('.',',')}.`;
  renderNumbers();
  update();
})();

continueBtn.onclick=async()=>{
  if(!bolao||set.size!==quantidade)return;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){location.href='./?login=1';return;}
  continueBtn.disabled=true;
  msg.textContent='Criando seu pedido...';
  paymentBox.style.display='none';
  const dezenas=[...set].sort((a,b)=>a-b);
  const {data:pedidoData,error:pedidoError}=await sb.functions.invoke('criar-pedido',{body:{bolao_id:id,jogos:[dezenas]}});
  if(pedidoError||!pedidoData?.ok){
    msg.textContent=await getFunctionError(pedidoError,pedidoData);
    continueBtn.disabled=false;
    return;
  }
  const pedidoId=pedidoData.pedido?.id;
  if(!pedidoId){
    msg.textContent='Pedido criado, mas o identificador do pedido não foi retornado.';
    continueBtn.disabled=false;
    return;
  }
  msg.textContent=`Pedido ${pedidoId.slice(0,8)} criado. Gerando Pix...`;

  const {data:paymentData,error:paymentError}=await sb.functions.invoke('criar-pagamento',{body:{pedido_id:pedidoId}});
  if(paymentError||!paymentData?.ok){
    msg.textContent=await getFunctionError(paymentError,paymentData);
    continueBtn.disabled=false;
    continueBtn.textContent='Tentar pagamento novamente';
    return;
  }

  msg.textContent='Pagamento Pix gerado com sucesso.';
  continueBtn.textContent='Pagamento gerado';
  showPayment(paymentData);
};
</script>
</body></html>
