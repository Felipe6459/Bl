<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolher dezenas — BL</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="./">BL</a><a class="btn btn-outline" href="minha-conta.html">Minha conta</a></header>
<main class="section"><span class="eyebrow">Seu jogo</span><h1 id="title">Escolha 10 dezenas</h1><p id="description">Selecione exatamente 10 números. A mesma dezena pode aparecer em outros jogos e até o mesmo jogo pode ser comprado por mais de uma pessoa.</p><div id="numbers" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:24px 0"></div><div class="card"><strong id="counter">0/10 selecionadas</strong><p id="selected">—</p><button id="continue" class="btn btn-large" disabled>Continuar</button><p id="msg" class="message"></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://ujddnzckfrksetsfgden.supabase.co','sb_publishable_Lo9uaX-E9hHcL-w2El6M3g_OoCRma3W');const id=new URLSearchParams(location.search).get('bolao');const set=new Set();const box=document.getElementById('numbers');
for(let n=1;n<=60;n++){const b=document.createElement('button');b.textContent=String(n).padStart(2,'0');b.className='btn btn-outline';b.style.padding='12px 4px';b.onclick=()=>{if(set.has(n)){set.delete(n);b.style.background='transparent';}else if(set.size<10){set.add(n);b.style.background='#fff';b.style.color='#111';}update();};box.appendChild(b)}
function update(){const arr=[...set].sort((a,b)=>a-b);document.getElementById('counter').textContent=`${arr.length}/10 selecionadas`;document.getElementById('selected').textContent=arr.length?arr.map(n=>String(n).padStart(2,'0')).join(' · '):'—';document.getElementById('continue').disabled=arr.length!==10;}
(async()=>{if(!id){document.getElementById('msg').textContent='Bolão não informado.';return;}const {data}=await sb.from('boloes').select('nome,concurso,valor_jogo,descricao').eq('id',id).eq('status','ativo').single();if(!data){document.getElementById('msg').textContent='Bolão não encontrado ou já encerrado.';return;}document.getElementById('title').textContent=data.nome;document.getElementById('description').textContent=`Concurso ${data.concurso}. ${data.descricao||'Escolha exatamente 10 dezenas.'} Valor por jogo: R$ ${Number(data.valor_jogo).toFixed(2).replace('.',',')}.`;})();
document.getElementById('continue').onclick=async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){location.href='./?login=1';return;}document.getElementById('msg').textContent='Seleção pronta. A etapa de pagamento será ligada ao Asaas antes da publicação da venda real.';};
</script></body></html>
