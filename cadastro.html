<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BL — Criar conta</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">BL</a></header>
<main><section class="hero"><span class="eyebrow">Cadastro</span><h1>Crie sua conta</h1><p>Cadastre-se para montar e acompanhar seus jogos.</p></section>
<section class="section" style="max-width:520px;margin:auto"><div class="card" style="padding:24px"><form id="authForm">
<label>Nome completo<br><input id="fullName" type="text" autocomplete="name" required></label><br>
<label>E-mail<br><input id="email" type="email" autocomplete="email" required></label><br>
<label>CPF<br><input id="cpf" type="text" inputmode="numeric" maxlength="14" required></label><br>
<label>Telefone / WhatsApp<br><input id="phone" type="tel" inputmode="tel" maxlength="15" autocomplete="tel" required></label><br>
<label>Senha<br><input id="password" type="password" autocomplete="new-password" minlength="6" required></label><br>
<button id="authSubmit" class="btn" type="submit">Criar minha conta</button><p id="authMessage"></p><p>Já tem uma conta? <a href="login.html">Entrar</a></p>
</form></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>window.addEventListener('load', function(){if(typeof registerMode!=='undefined')registerMode=true;});</script>
</body></html>
