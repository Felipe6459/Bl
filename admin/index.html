<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Master — BL</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../">BL MASTER</a><div class="session-area"><a class="btn btn-outline" href="./boloes.html">🎟️ Bolões</a><button class="btn btn-outline" id="logoutBtn">Sair</button></div></header>
<main class="section">
  <div class="section-heading"><div><span class="eyebrow">Gerenciamento</span><h1>Painel Master</h1></div></div>
  <div id="adminMessage" class="message"></div>
  <section class="admin-stats" id="stats"></section>
  <section class="section-block">
    <div class="section-heading"><div><span class="eyebrow">Configuração</span><h2>Bolões</h2></div><a class="btn btn-primary" href="./boloes.html">Gerenciar bolões</a></div>
  </section>

  <section class="section-block">
    <div class="section-heading"><div><span class="eyebrow">Acompanhamento</span><h2>Todos os jogos</h2></div></div>
    <div class="admin-tools"><input id="searchGames" placeholder="Pesquisar cliente, telefone ou dezenas..."><select id="statusFilter"><option value="">Todos os status</option><option value="pago">Pago</option><option value="aguardando_pagamento">Aguardando pagamento</option><option value="cancelado">Cancelado</option><option value="expirado">Expirado</option></select></div>
    <div id="gamesList" class="admin-table-wrap"><div class="empty">Carregando jogos...</div></div>
  </section>

  <section class="section-block">
    <div class="section-heading"><div><span class="eyebrow">Clientes</span><h2>Clientes cadastrados</h2></div></div>
    <div id="clientsList" class="admin-table-wrap"><div class="empty">Carregando clientes...</div></div>
  </section>
</main>
<script type="module" src="../js/admin.js"></script>
</body></html>
