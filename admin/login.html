<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar no painel — BL</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="../">BL</a></header>
<main class="section admin-login">
  <span class="eyebrow">Acesso do dono</span>
  <h1>Painel administrativo</h1>
  <p class="admin-muted">Entre com a conta administrativa para acompanhar clientes, pedidos, pagamentos e todos os jogos.</p>
  <form id="adminLoginForm" class="card admin-form">
    <label>E-mail<input id="email" type="email" autocomplete="username" required placeholder="Seu e-mail"></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label>
    <button class="btn btn-large" type="submit">Entrar no painel</button>
    <div id="message" class="message" role="alert"></div>
  </form>
</main>
<script type="module" src="../js/admin-login.js"></script>
</body></html>
