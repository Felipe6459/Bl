<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BL — Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html">BL</a>
</header>
<main>
<section class="hero">
<span class="eyebrow">Acesso</span>
<h1>Entrar na sua conta</h1>
<p>Acesse seus jogos e suas compras.</p>
</section>
<section class="section" style="max-width:520px;margin:auto">
<div class="card" style="padding:24px">
<form id="authForm">
<label>Telefone / WhatsApp<br><input id="phone" type="tel" inputmode="tel" maxlength="15" autocomplete="tel" required></label><br>
<label>Senha<br><input id="password" type="password" autocomplete="current-password" required></label><br>
<button id="authSubmit" class="btn" type="submit">Entrar</button>
<p id="authMessage"></p>
<p>Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
</form>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
window.addEventListener('load', function(){
  if (typeof registerMode !== 'undefined') registerMode = false;
  var f=document.getElementById('registerFields'); if(f) f.hidden=true;
  var s=document.getElementById('switchAuth'); if(s) s.remove();
});
</script>
</body>
</html>
